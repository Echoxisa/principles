<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原则 · 身份</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-text">
        <p class="eyebrow">当前身份</p>
        <h1>原则</h1>
        <p class="subtitle">想法 · 语言 · 行动 —— 只留你仍选择的自己</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn ghost" id="btn-export" title="导出 JSON">导出</button>
        <label class="btn ghost file-label" title="导入 JSON">
          导入
          <input type="file" id="input-import" accept="application/json,.json" hidden />
        </label>
        <button type="button" class="btn primary" id="btn-new">+ 新原则</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="active" role="tab">生效中</button>
      <button type="button" class="tab" data-tab="archived" role="tab">已不选择</button>
    </nav>

    <main>
      <section id="panel-active" class="panel active"></section>
      <section id="panel-archived" class="panel" hidden></section>
    </main>

    <footer class="footer">
      <span>数据保存在本机浏览器（localStorage）</span>
      <span class="dot">·</span>
      <span>请定期导出备份</span>
    </footer>
  </div>

  <!-- 新建 / 编辑 -->
  <dialog id="dialog-form" class="dialog">
    <form method="dialog" id="form-principle">
      <h2 id="form-title">新原则</h2>
      <label class="field">
        <span>名称</span>
        <input type="text" id="field-title" required maxlength="80" placeholder="一句话可指认" />
      </label>
      <label class="field">
        <span>说明</span>
        <textarea id="field-body" rows="4" maxlength="2000" placeholder="我选择经验什么？想法 / 语言 / 行动如何体现？"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="form-cancel">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 归档 -->
  <dialog id="dialog-archive" class="dialog">
    <form method="dialog" id="form-archive">
      <h2>不再选择</h2>
      <p class="dialog-hint">不选择也是一种选择。可留下为何不再选（可选）。</p>
      <label class="field">
        <span>原因（可选）</span>
        <textarea id="field-archive-reason" rows="3" maxlength="500" placeholder="不符合灵魂感受 / 试过无效 / 被新原则取代…"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="archive-cancel">取消</button>
        <button type="submit" class="btn warn">确认归档</button>
      </div>
    </form>
  </dialog>

  <!-- 反馈 -->
  <dialog id="dialog-feedback" class="dialog">
    <form method="dialog" id="form-feedback">
      <h2>生活反馈</h2>
      <p class="dialog-hint" id="feedback-principle-name"></p>
      <fieldset class="kinds">
        <legend>类型</legend>
        <label><input type="radio" name="kind" value="thought" checked /> 想法</label>
        <label><input type="radio" name="kind" value="speech" /> 语言</label>
        <label><input type="radio" name="kind" value="action" /> 行动</label>
      </fieldset>
      <label class="field">
        <span>发生了什么</span>
        <textarea id="field-feedback" rows="3" required maxlength="800" placeholder="一句真实记录即可"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="feedback-cancel">取消</button>
        <button type="submit" class="btn primary">记下</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
